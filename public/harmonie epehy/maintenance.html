<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Site en maintenance - Orchestre d'Harmonie d'Épehy</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #6a1b3f 0%, #4a1530 100%);
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            overflow: hidden;
        }

        .maintenance-container {
            text-align: center;
            max-width: 600px;
            padding: 40px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.2);
            animation: fadeIn 0.5s ease-in;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo {
            font-size: 3rem;
            margin-bottom: 20px;
            color: #d4af37;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 20px;
            color: #ffffff;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }

        .subtitle {
            font-size: 1.3rem;
            margin-bottom: 30px;
            color: #e0e0e0;
        }

        .message {
            font-size: 1.1rem;
            line-height: 1.8;
            margin-bottom: 40px;
            color: #f0f0f0;
        }

        .icon {
            font-size: 5rem;
            margin-bottom: 30px;
            animation: rotate 3s linear infinite;
        }

        @keyframes rotate {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }

        .spinner {
            display: inline-block;
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top-color: #d4af37;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .footer {
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.2);
            font-size: 0.9rem;
            color: #d0d0d0;
        }

        .hidden {
            display: none;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 2rem;
            }

            .subtitle {
                font-size: 1.1rem;
            }

            .logo {
                font-size: 2.5rem;
            }

            .maintenance-container {
                padding: 30px 20px;
            }
        }

        /* Particules animées en arrière-plan */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: rgba(212, 175, 55, 0.5);
            border-radius: 50%;
            animation: float 15s infinite;
        }

        @keyframes float {
            0% {
                transform: translateY(100vh) translateX(0);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(-100px) translateX(100px);
                opacity: 0;
            }
        }
    </style>
</head>
<body>
    <!-- Particules animées -->
    <div class="particles" id="particles"></div>

    <div class="maintenance-container">
        <div class="logo">🎵</div>
        <h1>Site en maintenance</h1>
        <p class="subtitle">Orchestre d'Harmonie d'Épehy</p>
        <div class="spinner"></div>
        <p class="message">
            Nous effectuons actuellement des travaux de maintenance sur notre site.<br>
            Nous serons de retour très bientôt.<br><br>
            Merci de votre patience.
        </p>
        <div class="footer">
            <p>Pour toute urgence, vous pouvez nous contacter directement.</p>
        </div>
    </div>

    <script>
        // Code d'accès secret (modifiable)
        const MAINTENANCE_CODE = "OHE2024";

        // Vérifier si l'utilisateur est déjà authentifié
        function checkAuth() {
            const authCookie = getCookie('maintenance_auth');
            const authSession = sessionStorage.getItem('maintenance_auth');
            
            if (authCookie === 'true' || authSession === 'true') {
                // L'utilisateur est authentifié, rediriger vers la page d'origine ou index
                const returnUrl = getUrlParameter('return') || 'index.php';
                window.location.href = returnUrl;
                return;
            }

            // Demander le code d'accès
            authenticate();
        }

        // Fonction d'authentification
        function authenticate() {
            const code = prompt("🔐 Accès à la maintenance\n\nEntrez le code d'accès pour continuer :");
            
            if (code === null) {
                // L'utilisateur a annulé, rester sur la page de maintenance
                return;
            }

            if (code === MAINTENANCE_CODE) {
                // Code correct
                // Définir un cookie qui expire dans 24 heures
                setCookie('maintenance_auth', 'true', 24);
                // Définir aussi dans sessionStorage pour cette session
                sessionStorage.setItem('maintenance_auth', 'true');
                
                // Rediriger vers la page demandée ou index
                const returnUrl = getUrlParameter('return') || 'index.php';
                window.location.href = returnUrl;
            } else {
                // Code incorrect
                alert("❌ Code d'accès incorrect.\n\nAccès refusé.");
                // Optionnel: redemander après un court délai
                setTimeout(authenticate, 1000);
            }
        }

        // Fonctions utilitaires pour les cookies
        function setCookie(name, value, hours) {
            const date = new Date();
            date.setTime(date.getTime() + (hours * 60 * 60 * 1000));
            const expires = "expires=" + date.toUTCString();
            document.cookie = name + "=" + value + ";" + expires + ";path=/";
        }

        function getCookie(name) {
            const nameEQ = name + "=";
            const ca = document.cookie.split(';');
            for (let i = 0; i < ca.length; i++) {
                let c = ca[i];
                while (c.charAt(0) === ' ') c = c.substring(1, c.length);
                if (c.indexOf(nameEQ) === 0) return c.substring(nameEQ.length, c.length);
            }
            return null;
        }

        // Fonction pour récupérer les paramètres URL
        function getUrlParameter(name) {
            name = name.replace(/[\[]/, '\\[').replace(/[\]]/, '\\]');
            const regex = new RegExp('[\\?&]' + name + '=([^&#]*)');
            const results = regex.exec(location.search);
            return results === null ? '' : decodeURIComponent(results[1].replace(/\+/g, ' '));
        }

        // Créer des particules animées
        function createParticles() {
            const particlesContainer = document.getElementById('particles');
            const particleCount = 20;

            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.animationDelay = Math.random() * 15 + 's';
                particle.style.animationDuration = (10 + Math.random() * 10) + 's';
                particlesContainer.appendChild(particle);
            }
        }

        // Vérifier l'authentification au chargement de la page
        window.addEventListener('DOMContentLoaded', function() {
            createParticles();
            // Démarrer la vérification d'authentification après un court délai
            setTimeout(checkAuth, 500);
        });

        // Vérifier aussi si l'utilisateur appuie sur une touche spéciale (optionnel)
        let keySequence = '';
        document.addEventListener('keydown', function(e) {
            keySequence += e.key;
            if (keySequence.length > 10) {
                keySequence = keySequence.slice(-10);
            }
            
            // Si l'utilisateur tape "maintenance" rapidement
            if (keySequence.toLowerCase().includes('maintenance')) {
                authenticate();
                keySequence = '';
            }
        });
    </script>
</body>
</html>
